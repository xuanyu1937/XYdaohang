<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离线</title>
<meta name="theme-color" content="#3b82f6">
<style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6fa;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    main{text-align:center;padding:32px}
    .icon{width:72px;height:72px;margin:0 auto 20px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center}
    h1{font-size:20px;margin:0 0 8px}
    p{color:#6b7280;font-size:14px;margin:0 0 24px}
    button{border:0;background:#3b82f6;color:#fff;padding:10px 24px;border-radius:10px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<main>
    <div class="icon"><svg viewBox="0 0 64 64" width="44" height="44" fill="none"><path d="M32 13c-6.6 0-12 5.4-12 12 0 8.2 12 26 12 26s12-17.8 12-26c0-6.6-5.4-12-12-12z" fill="#fff"/><circle cx="32" cy="25" r="5" fill="#1d4ed8"/></svg></div>
    <h1>当前处于离线状态</h1>
    <p>网络恢复后即可继续使用导航。</p>
    <button onclick="location.reload()">重试</button>
</main>
</body>
</html>
